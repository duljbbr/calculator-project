
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>

    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear">C</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>0</button>
            <button>×</button>
            <button>÷</button>
            <button class="equal">=</button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
